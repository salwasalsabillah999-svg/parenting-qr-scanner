
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in Parenting</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .card {
      max-width: 520px;
      margin: auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { text-align: center; font-size: 24px; }
    p { text-align: center; color: #64748b; }
    #reader { width: 100%; margin: 20px auto; }
    #hasil {
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      background: #f1f5f9;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .sukses { background: #dcfce7 !important; color: #166534; }
    .gagal { background: #fee2e2 !important; color: #991b1b; }
    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Check-in Parenting</h1>
    <p>Arahkan QR tiket ke kamera laptop.</p>
    <div id="reader"></div>
    <button id="mulai">Mulai Scan QR</button>
    <div id="hasil">Kamera belum dijalankan.</div>
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxaMH866l_KhgRiNxyZNubJTPRZb84i6_FupiluhO1V3EulMUKqklR4pq8L3BD0Ix2S/exec';

const tombol = document.getElementById('mulai');
const hasil = document.getElementById('hasil');

let scanner = null;
let sedangProses = false;
let kameraAktif = false;
let kodeTerakhir = '';

function tampil(pesan, kelas = '') {
  hasil.className = kelas;
  hasil.textContent = pesan;
}

function kirimKode(kode) {
  if (sedangProses) return;

  sedangProses = true;
  tampil('Memeriksa tiket...');

  const callback = 'hasilAPI_' + Date.now();

  let selesai = false;
  const script = document.createElement('script');

  const timer = setTimeout(() => {
    beres({
      sukses: false,
      pesan: 'Server tidak merespons. Periksa URL deployment.'
    });
  }, 15000);

  function beres(data) {
    if (selesai) return;
    selesai = true;

    clearTimeout(timer);
    delete window[callback];
    script.remove();

    if (data.sukses) {
      tampil(
        '✅ CHECK-IN BERHASIL!' +
        '\nNama: ' + (data.nama || '-') +
        '\nKelas: ' + (data.kelas || '-') +
        '\nUrutan Scan: ' + (data.urutan || '-') +
        '\nWaktu: ' + (data.waktu || '-'),
        'sukses'
      );
    } else {
      tampil(
        '⚠️ ' + (data.pesan || 'Check-in gagal.') +
        (data.nama ? '\nNama: ' + data.nama : '') +
        (data.kelas ? '\nKelas: ' + data.kelas : ''),
        'gagal'
      );
    }

    setTimeout(() => {
      sedangProses = false;
      kodeTerakhir = '';

      if (kameraAktif && scanner) {
        try {
          scanner.resume();
          tombol.textContent = 'Kamera Aktif — Scan Berikutnya';
          tombol.disabled = true;
          tampil(
            (data.sukses ? '✅ Check-in tersimpan.' : 'Scan selesai.') +
            '\nKamera siap untuk peserta berikutnya.'
          );
        } catch (e) {
          tombol.disabled = false;
          tombol.textContent = 'Mulai Scan QR';
          tampil('Klik Mulai Scan QR untuk melanjutkan.');
        }
      } else {
        tombol.disabled = false;
        tombol.textContent = 'Mulai Scan QR';
      }
    }, 1800);
  }

  window[callback] = beres;

  script.onerror = () => {
    beres({
      sukses: false,
      pesan: 'Gagal menghubungi Apps Script. Periksa URL dan deployment.'
    });
  };

  script.src = API_URL +
    '?action=catat' +
    '&callback=' + encodeURIComponent(callback) +
    '&kode=' + encodeURIComponent(kode) +
    '&t=' + Date.now();

  document.body.appendChild(script);
}

async function mulaiScanner() {
  tombol.disabled = true;
  tampil('Meminta akses kamera...');

  try {
    if (!scanner) {
      scanner = new Html5Qrcode('reader');
    }

    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 250 } },
      (teks) => {
        if (sedangProses || teks.trim() === kodeTerakhir) return;

        kodeTerakhir = teks.trim();
        scanner.pause(true);
        kirimKode(kodeTerakhir);
      },
      () => {}
    );

    kameraAktif = true;
    tombol.textContent = 'Kamera Aktif — Scan Berikutnya';
    tampil('Kamera aktif. Arahkan ke QR tiket.');
  } catch (err) {
    kameraAktif = false;
    tampil(
      'Kamera tidak bisa dibuka: ' + err +
      '\nPastikan memakai HTTPS dan izinkan kamera di browser.',
      'gagal'
    );
    tombol.disabled = false;
    tombol.textContent = 'Mulai Scan QR';
  }
}

tombol.addEventListener('click', async () => {
  if (kameraAktif && scanner) {
    try {
      await scanner.stop();
      kameraAktif = false;
      tombol.disabled = false;
      tombol.textContent = 'Mulai Scan QR';
      tampil('Kamera dihentikan.');
    } catch (e) {
      tampil('Kamera tidak dapat dihentikan: ' + e, 'gagal');
    }
    return;
  }

  await mulaiScanner();
});
</script>
</body>
</html>
